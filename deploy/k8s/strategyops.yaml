---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: strategyops
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
      containers:
        - name: gateway
          image: strategyops/gateway:local
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: strategyops-config }
            - secretRef: { name: strategyops-secrets }
          env:
            # Kubernetes Service DNS. This is the registry's job, done by the
            # platform: "projects-api" resolves and load-balances across pods.
            - { name: ReverseProxy__Clusters__projects__Destinations__d1__Address,  value: "http://projects-api:8080/" }
            - { name: ReverseProxy__Clusters__kpi__Destinations__d1__Address,       value: "http://kpi-api:8080/" }
            - { name: ReverseProxy__Clusters__risk__Destinations__d1__Address,      value: "http://risk-api:8080/" }
            - { name: ReverseProxy__Clusters__issues__Destinations__d1__Address,    value: "http://issues-api:8080/" }
            - { name: ReverseProxy__Clusters__benefits__Destinations__d1__Address,  value: "http://benefits-api:8080/" }
            - { name: ReverseProxy__Clusters__reporting__Destinations__d1__Address, value: "http://reporting-api:8080/" }
            - { name: ReverseProxy__Clusters__identity__Destinations__d1__Address,  value: "http://identity-api:8080/" }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: strategyops
spec:
  selector: { app: gateway }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: strategyops
  namespace: strategyops
spec:
  rules:
    - host: strategyops.local
      http:
        paths:
          # Only the gateway is exposed. Everything else is reachable inside the
          # cluster and nowhere else - which is why each service still validates
          # its own tokens: "inside the cluster" is not a trust boundary.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 80 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: projects
  namespace: strategyops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: projects
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: strategyops
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: gateway }

# StrategyOps on Kubernetes.
#
#   kubectl apply -f deploy/k8s/
#
# NOT APPLIED OR VERIFIED - the environment this was written in has no cluster.
# Reviewed by eye; expect to fix something on first apply.
#
# The point of reading this next to docker-compose.yml is what Kubernetes takes
# over from the application:
#
#   * SERVICE DISCOVERY. A Service gives each deployment a stable DNS name and
#     load-balances across its pods. The Discovery service is not deployed here
#     at all - the platform does its job, better, with no code.
#   * HEALTH. Liveness and readiness probes are why the split in the
#     application matters: a failing LIVENESS probe restarts the pod, a failing
#     READINESS probe only takes it out of the Service's endpoints. A liveness
#     probe that checked the database would restart every replica during a
#     database blip.
#   * ROLLING DEPLOYS. maxUnavailable: 0 means new pods must become READY before
#     old ones are removed, so a deploy is invisible to callers - which only
#     works because readiness is honest about when a pod can serve.
#   * SECRETS. The signing key stops being a value in a config file.
---
apiVersion: v1
kind: Namespace
metadata:
  name: strategyops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: strategyops-config
  namespace: strategyops
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  RabbitMq__Host: "rabbitmq"
  Jwt__Issuer: "https://strategyops.local/identity"
  Jwt__Audience: "strategyops-api"
  # Off deliberately: a Kubernetes Service already provides stable names and
  # load balancing. Running our own registry alongside it would be duplicate
  # machinery with worse failure modes.
  Discovery__Enabled: "false"
  Observability__OtlpEndpoint: "http://jaeger-collector:4317"
---
apiVersion: v1
kind: Secret
metadata:
  name: strategyops-secrets
  namespace: strategyops
type: Opaque
stringData:
  # Placeholders. In a real cluster these come from Sealed Secrets, External
  # Secrets, or the cloud provider's secret store - never from a file in git.
  Jwt__SigningKey: "REPLACE-ME-with-at-least-32-characters-from-a-secret-store"
  RabbitMq__Username: "strategyops"
  RabbitMq__Password: "REPLACE-ME"
  Postgres__Password: "REPLACE-ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projects
  namespace: strategyops
  labels: { app: projects }
spec:
  replicas: 2
  selector:
    matchLabels: { app: projects }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired count during a deploy. Combined with an
      # honest readiness probe, this makes rollouts invisible to callers.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: projects }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
      containers:
        - name: projects
          image: strategyops/projects:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: strategyops-config }
            - secretRef: { name: strategyops-secrets }
          env:
            - name: ConnectionStrings__Projects
              value: "Host=postgres;Database=strategyops_projects;Username=strategyops;Password=$(Postgres__Password)"
          # Liveness: is the process wedged? Failure KILLS the pod, so it must
          # not depend on anything external.
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          # Readiness: can this pod serve right now? Failure only removes it
          # from the Service, so it MAY check dependencies.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Startup probe buys slow starters time - EF migrations on boot, in
          # this case - without loosening the liveness probe for the pod's
          # whole life.
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: projects-api
  namespace: strategyops
spec:
  selector: { app: projects }
  ports:
    - port: 8080
      targetPort: 8080

